name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-build-test:
    name: C++ build + GoogleTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite3
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test (34 GoogleTests)
        run: ctest --test-dir build --output-on-failure -V

  pkv-claims-test:
    name: PKV Claims Engine — 21 GoogleTests (C++20 + PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pkv_test
          POSTGRES_USER: pkv
          POSTGRES_PASSWORD: pkv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install libpqxx
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpq-dev libpqxx-dev pkg-config

      - name: Apply schema
        env:
          PGPASSWORD: pkv
        run: psql -h localhost -U pkv -d pkv_test -f pkv_claims_engine/sql/schema.sql

      - name: Configure
        run: >
          cmake -B build/pkv
                -S pkv_claims_engine
                -DCMAKE_BUILD_TYPE=Release
                -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build test_pkv
        run: cmake --build build/pkv --target test_pkv -j$(nproc)

      - name: Run 21 GoogleTests
        env:
          PGCONNINFO: "host=localhost port=5432 dbname=pkv_test user=pkv password=pkv"
        run: ctest --test-dir build/pkv --output-on-failure -V

  python-tests:
    name: Python PDU aggregator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps
        run: uv sync --frozen
      - name: Run pytest
        run: uv run pytest pdu/tests/ -v
