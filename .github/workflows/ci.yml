name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-build-test:
    name: C++ build + GoogleTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite3
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test (34 GoogleTests)
        run: ctest --test-dir build --output-on-failure -V

  python-tests:
    name: Python PDU aggregator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps
        run: uv sync --frozen
      - name: Run pytest
        run: uv run pytest pdu/tests/ -v
